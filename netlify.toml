[build]
  # PKG-00C: Netlify solo publica si pasan lint, typecheck, tests (incluye las
  # pruebas de DB con PGlite, sin secretos ni red) y el build de producción.
  # Cualquier etapa en rojo → exit ≠ 0 → el deploy falla y queda el publicado anterior.
  command = "npm run ci:gate"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PKG-06D (FR-37): ningún source map se sirve en producción (el build ya no los
# genera; esto cubre cualquier .map que llegara a dist por otra vía).
[[redirects]]
  from = "/*.map"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    # PKG-06D (FR-25) · Content-Security-Policy. Inventario real de orígenes
    # (src/__tests__/csp.test.ts lo verifica):
    #  - script-src: solo el bundle propio y Stripe.js (PaymentElement). Sin
    #    'unsafe-inline' ni 'unsafe-eval'; el único <script> inline de index.html
    #    es ld+json (dato, no código).
    #  - style-src: CSS propio + Google Fonts. 'unsafe-inline' SOLO aquí: librerías
    #    de terceros (qr-code-styling genera SVG con atributos style; el wrapper de
    #    Stripe Elements) fijan estilos como atributo, que CSP bloquea sin esta
    #    excepción; los estilos de React van por CSSOM y no la necesitan. El
    #    riesgo de inyección de estilos es menor y script-src sigue estricto.
    #  - connect-src: Supabase (REST/Auth/Storage, y wss por si se usa realtime),
    #    la API de Stripe y las funciones propias (same-origin).
    #  - img-src: propio, Supabase Storage (avatares, logos, material), data:/blob:
    #    (previsualizaciones de cámara y QR) y Stripe.
    #  - frame-src: iframes de Stripe Elements y 3DS. frame-ancestors 'none' =
    #    X-Frame-Options DENY. Sentry no está configurado: si se activa, añadir su
    #    host de ingest a connect-src (D-FIN-2).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cfihcrjbvgjiohedsjos.supabase.co https://*.stripe.com; connect-src 'self' https://cfihcrjbvgjiohedsjos.supabase.co wss://cfihcrjbvgjiohedsjos.supabase.co https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# ── Crons ────────────────────────────────────────────────────────────────────
# OJO: la sintaxis de Netlify para funciones programadas es [functions."nombre"]
# con `schedule`. El bloque [[scheduled_functions]] que había antes NO existe en
# Netlify: lo ignoraba en silencio y ningún cron corrió jamás (lección de SALA:
# 53 membresías vencidas seguían "activas"). Verificar tras el deploy que cada
# función diga "Scheduled" en el panel de Netlify. Hay un test que falla si este
# archivo vuelve a la sintaxis vieja (src/__tests__/netlify-crons.test.ts).

[functions."cron-no-shows"]
  schedule = "0 * * * *"

[functions."cron-recordatorios"]
  schedule = "*/15 * * * *"

[functions."cron-expirar-membresias"]
  schedule = "0 7 * * *"

# Avisa al miembro 3 días antes de que caduque su paquete / termine su plan (≈8:00 Culiacán).
[functions."cron-membresias-por-vencer"]
  schedule = "0 15 * * *"

# Felicita por cumpleaños (≈9:00 Culiacán).
[functions."cron-felicitaciones"]
  schedule = "0 16 * * *"

# Reparte por push toda notificación pendiente (de cualquier origen).
[functions."cron-push"]
  schedule = "* * * * *"

# Manda por correo los avisos de la app que lo ameritan (confirmación de reserva,
# cancelación, material disponible…). No-op mientras Resend no esté configurado.
[functions."cron-email"]
  schedule = "*/2 * * * *"

# Libera el espacio de los archivos de material vencidos hace más de 7 días.
# 10:30 UTC = 03:30 en Mazatlán.
[functions."cron-material-vencido"]
  schedule = "30 10 * * *"

# PKG-03B (fase D): reconciliación Stripe DETECT-ONLY diaria (EKKO-140). Solo lee
# Stripe (accounts.retrieve, subscriptions.list) y asienta discrepancias; no
# repara nada. 09:00 UTC = 02:00 en Mazatlán. Mismo núcleo que el endpoint manual
# `reconciliar-stripe` (protegido por token).
[functions."cron-reconciliar-stripe"]
  schedule = "0 9 * * *"
